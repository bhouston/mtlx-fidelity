name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Full recursive checkout would also pull submodules/blender, submodules/MaterialX, and
          # submodules/OpenShadingLanguage - large C++ source trees only needed to build the native
          # Blender/MaterialX renderers, not to build/tsc/lint/test the TypeScript packages in this repo.
          # Init only the "viewer" submodule set below, matching deploy-service.yml's `submodules: viewer`.
          submodules: false
      - name: Checkout viewer submodules
        run: |
          # Runners have no SSH keys; rewrite the git@github.com submodule URLs to HTTPS.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync -- submodules/mtlx-sample-library submodules/material-viewer submodules/three.js
          git submodule update --init --depth 1 \
            submodules/mtlx-sample-library \
            submodules/material-viewer \
            submodules/three.js
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - name: Check formatting
        run: pnpm exec oxfmt --check .
      - run: pnpm test --coverage
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
